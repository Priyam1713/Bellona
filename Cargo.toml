[workspace]
resolver = "2"
members = [
    "forge",
    "praetorium",
    "bellum",
    "memoria",
    "castra",
    "officina",
    "foedus",
    "vigiles",
    "auxilia",
    "bellona",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bellona-works/bellona"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
cel-interpreter = "0.10"

# internal crates
forge = { path = "forge" }
praetorium = { path = "praetorium" }
memoria = { path = "memoria" }
bellum = { path = "bellum" }
auxilia = { path = "auxilia" }

[profile.release]
lto = true
codegen-units = 1
strip = true
